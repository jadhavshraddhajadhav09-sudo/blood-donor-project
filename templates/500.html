{% extends 'base.html' %}

{% block title %}500 Server Error - LifeBlood Registry{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="stat-icon mx-auto mb-4 text-warning bg-warning bg-opacity-10" style="width:100px; height:100px; font-size:3rem;">
      <i class="bi bi-exclamation-triangle-fill"></i>
    </div>
    <h1 class="display-3 fw-bold text-dark mb-2">500</h1>
    <h3 class="fw-bold mb-3">Internal Server Error</h3>
    <p class="text-muted max-width-500 mx-auto mb-4">
      Something went wrong on our server. Please try refreshing the page or try again later.
    </p>
    <a href="{{ url_for('main.home') }}" class="btn btn-theme-red btn-lg">
      <i class="bi bi-house-door-fill me-2"></i> Back to Home
    </a>
  </div>
</div>
{% endblock %}
