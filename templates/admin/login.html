{% extends 'base.html' %}

{% block title %}Admin Login - LifeBlood Registry{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center py-4">
    <div class="col-md-5 col-lg-4">
      <div class="card border-0 rounded-4 shadow-lg p-4 bg-white">
        <div class="text-center mb-4">
          <div class="stat-icon mx-auto mb-3 text-danger bg-danger bg-opacity-10" style="width:64px; height:64px; font-size:1.8rem;">
            <i class="bi bi-shield-lock-fill"></i>
          </div>
          <h4 class="fw-bold mb-1">Admin Portal</h4>
          <p class="text-muted small">Log in to access system management dashboard</p>
        </div>

        <form action="{{ url_for('admin.login') }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="username" class="form-label small fw-bold text-secondary">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="username" name="username" required placeholder="Admin username">
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label small fw-bold text-secondary">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
              <input type="password" class="form-control" id="password" name="password" required placeholder="Admin password">
            </div>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-theme-red py-2.5 fw-bold">
              <i class="bi bi-box-arrow-in-right me-1"></i> Log In
            </button>
          </div>
        </form>

        <div class="alert alert-light border small text-muted text-center mb-0">
          <i class="bi bi-info-circle text-danger me-1"></i> Admin credentials are loaded from your <code>.env</code> file (<code>ADMIN_USERNAME</code> & <code>ADMIN_PASSWORD</code>).
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
